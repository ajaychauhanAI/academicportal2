<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Attendance Control</title>

  <style>
    :root {
      --primary: #1e40af;
      --primary-soft: #e0e7ff;
      --danger: #b91c1c;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    /* ===== BODY FIX ===== */
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);

      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }

    .topbar span {
      font-size: 13px;
      color: var(--muted);
    }

    /* ===== MAIN CONTAINER ===== */
   .container {
      width: min(96%, 1900px);
      margin: auto;
      padding: 24px;
      flex: 1;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    /* ===== FORM GRID ===== */
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    @media (max-width: 1024px) {
      .row { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
    }

    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    /* ===== ACTIONS ===== */
    .actions {
      margin-top: 22px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-start {
      background: var(--primary);
      color: white;
    }

    .btn-stop {
      background: var(--danger);
      color: white;
    }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr; }
    }

    .stat {
      padding: 22px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid var(--border);
    }

    .stat p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .stat h2 {
      margin: 10px 0 0;
      font-size: 30px;
      font-weight: 700;
      color: var(--primary);
    }

    /* ===== FOOTER FIX ===== */
    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 16px 0;
      margin-top: auto; /* 🔥 footer always bottom */
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <h1>Attendance Management</h1>
    <span>Location Based Attendance</span>
  </div>

  <!-- MAIN -->
  <div class="container">

    <div class="section-title">Attendance Session Configuration</div>
    <div class="card">
      <div class="row">
        <div>
          <label>Batch</label>
          <select id="batch">
            <option value="">Select Batch</option>
            <option>BCADS21</option>
            <option>BCADS22</option>
            <option>BCADS23</option>
            <option>BCADS24</option>
            <option>BCADS25</option>
            <option>BCADS26</option>
          </select>
        </div>

        <div>
          <label>Subject</label>
          <select id="subject">
            <option value="">Select Subject</option>
            <option>Big Data Fundamentals</option>
            <option>Data Science</option>
            <option>DWDM</option>
            <option>DAA</option>
            <option>Deep Learning</option>
            <option>Cloud Computing</option>
            <option>MAD</option>
          </select>
        </div>

        <div>
          <label>Allowed Radius (meters)</label>
          <input type="number" id="radius" value="100">
        </div>

        <div>
          <label>Auto Close After (minutes)</label>
          <input type="number" id="duration" value="10">
        </div>
      </div>

      <div class="actions">
        <button class="btn-start" onclick="startSession()">Start Attendance</button>
        <button class="btn-stop" onclick="stopSession()">Stop Attendance</button>
      </div>
    </div>

    <div class="section-title">Live Attendance Status</div>
    <div class="card">
      <div class="stats">
        <div class="stat">
          <p>Total Present</p>
          <h2 id="presentCount">0</h2>
        </div>
        <div class="stat">
          <p>Rejected Attempts</p>
          <h2 id="rejectedCount">0</h2>
        </div>
        <div class="stat">
          <p>Session State</p>
          <h2 id="sessionStatus">OFF</h2>
        </div>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    Attendance System • Secure Admin Panel
  </div>

<script>
  function startSession() {
    google.script.run.startAttendanceSession({
      batch: batch.value,
      subject: subject.value,
      radius: radius.value,
      duration: duration.value
    });
  }

  function stopSession() {
    google.script.run.stopAttendanceSession();
  }
</script>

</body>
</html>
