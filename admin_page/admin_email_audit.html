<!DOCTYPE html>
<html>
<head>
  <title>Email Delivery Audit Logs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
*,*::before,*::after{box-sizing:border-box}

body {
  margin: 0;
  font-family: 'Poppins', Arial;
  background: transparent;
  visibility: hidden;
}

/* ===== CARD ===== */
.card{
  background:rgba(255,255,255,.95);
  width:95%;
  max-width:1210px;
  border-radius:18px;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
  overflow:hidden;
  margin: 24px auto;
}

/* ===== HEADER (FIXED RESPONSIVE GRID) ===== */
/* ===== HEADER (SINGLE LINE CONTROLS) ===== */
.header{
  display:grid;
  grid-template-columns: 1fr 160px auto;
  grid-template-areas:
    "title title title"
    "search filter auto";
  gap:12px;
  padding:16px;
  align-items:center;
}

.header h2{
  grid-area:title;
  margin:0;
  font-size:18px;
}

.header input{
  grid-area:search;
}

.header select{
  grid-area:filter;
}

.header label{
  grid-area:auto;
  font-size:13px;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
}

.header input,
.header select{
  padding:7px 9px;
  font-size:13px;
  border-radius:6px;
  border:1px solid #ccc;
}

.divider{height:1px;background:#ddd}

/* ===== CONTENT ===== */
.content{
  padding:16px;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:1100px;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  border:1px solid #ddd;
  padding:7px;
  text-align:left;
}

th{background:#f2f2f2}

tr:nth-child(even){background:#fafafa}
tr:hover{background:#eef2ff}

.sent{color:#15803d;font-weight:600}
.failed{color:#b91c1c;font-weight:600}

.load-more{
  margin:14px auto 10px;
  padding:8px 16px;
  border-radius:8px;
  border:none;
  background:#667eea;
  color:#fff;
  cursor:pointer;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .header{
    grid-template-columns:1fr;
    grid-template-areas:
      "title"
      "search"
      "filter"
      "auto";
  }

  .header label{
    justify-self:flex-start;
  }

  .header input,
  .header select{
    width:100%;
  }

  .card{
    width:94%;
    margin-top:24px;
  }
}

/* =========================
   STATUS COLUMN FIX
========================= */

/* Status column width + alignment */
td.status {
  min-width: 90px;        /* baaki columns jaisa */
  font-weight: 500;       /* normal text weight */
  font-size: 13px;        /* same as table */
}

/* Status colors (sirf color difference) */
td.status.sent {
  color: #15803d;
}

td.status.failed {
  color: #b91c1c;
}

td.status.queued {
  color: #b45309;
}

td.status.skipped {
  color: #475569;
}

</style>

</head>

<!-- ===== CARD ===== -->
<div class="card">

  <div class="header">
    <h2>📊 Email Delivery Audit Logs</h2>

    <input id="searchBox" placeholder="Search by email / roll / batch"
           oninput="filterLogs()">

    <select id="statusFilter" onchange="filterLogs()">
      <option value="">All</option>
      <option value="SENT">SENT</option>
      <option value="FAILED">FAILED</option>
    </select>

    <label>
      <input type="checkbox" id="autoRefresh"
             onchange="toggleAutoRefresh()"> Auto
    </label>
  </div>

  <div class="divider"></div>

  <div class="content">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Email Type</th>
          <th>To</th>
          <th>Roll</th>
          <th>Batch</th>
          <th>Status</th>
          <th>Error</th>
          <th>Delay (ms)</th>
        </tr>
      </thead>
      <tbody id="auditBody"></tbody>
    </table>

    <button class="load-more" onclick="loadMore()">⏬ Load More</button>
  </div>

</div>

<script src="admin-common.js"></script>
<script>
/*************************************************
 * admin-email-audit.js
 * ONLY FOR EMAIL AUDIT PAGE
 *************************************************/

/* =====================
   STATE
===================== */
let ALL_LOGS = [];
let VIEW_LOGS = [];
let LIMIT = 20;
let timer = null;

/* =====================
   DOM CACHE (FIXED)
===================== */
const auditBody     = document.getElementById("auditBody");
const searchBox     = document.getElementById("searchBox");
const statusFilter  = document.getElementById("statusFilter");
const autoRefresh   = document.getElementById("autoRefresh");
const loadMoreBtn   = document.querySelector(".load-more");

/* =====================
   INIT
===================== */
document.addEventListener("DOMContentLoaded", () => {
  // page visible
  document.body.style.visibility = "visible";

  // initial data load
  loadAudit();

  // auto-refresh checkbox agar checked ho
  if (autoRefresh && autoRefresh.checked) {
    toggleAutoRefresh();
  }
});
/* =====================
   LOAD EMAIL AUDIT
===================== */
function loadAudit() {
  adminFetch({ action: "get_email_audit" })
    .then(rows => {

      if (!Array.isArray(rows) || rows.length === 0) {
        auditBody.innerHTML =
          `<tr><td colspan="9">No email audit logs found</td></tr>`;
        if (loadMoreBtn) loadMoreBtn.style.display = "none";
        return;
      }

      ALL_LOGS  = rows;
      VIEW_LOGS = rows;
      LIMIT = 20;
      render();
    })
    .catch(err => {
      console.error("Failed to load email audit", err);
    });
}

/* =====================
   RENDER TABLE
===================== */
function render() {
  auditBody.innerHTML = "";

  const rows = VIEW_LOGS.slice(0, LIMIT);

  if (!rows.length) {
    auditBody.innerHTML =
      `<tr><td colspan="9" style="text-align:center;color:#888">
        No email audit logs found
      </td></tr>`;
    if (loadMoreBtn) loadMoreBtn.style.display = "none";
    return;
  }

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${formatDate(r[0])}</td>
      <td>${formatTime(r[1])}</td>
      <td>${r[2] || ""}</td>
      <td>${r[3] || ""}</td>
      <td>${r[4] || ""}</td>
      <td>${r[5] || ""}</td>
      <td class="status ${String(r[6] || "").toLowerCase()}">${r[6] || ""}</td>
      <td>${r[7] || ""}</td>
      <td>${r[8] || ""}</td>
    `;
    auditBody.appendChild(tr);
  });

  if (loadMoreBtn) {
    loadMoreBtn.style.display =
      VIEW_LOGS.length > LIMIT ? "block" : "none";
  }
}

/* =====================
   FILTER
===================== */
function filterLogs() {
  const q = searchBox.value.toLowerCase();
  const s = statusFilter.value;

  VIEW_LOGS = ALL_LOGS.filter(r => {
    const hay = [r[2], r[3], r[4], r[5]]
      .join(" ")
      .toLowerCase();

    if (q && !hay.includes(q)) return false;
    if (s && r[6] !== s) return false;
    return true;
  });

  LIMIT = 20;
  render();
}

/* =====================
   LOAD MORE
===================== */
function loadMore() {
  LIMIT += 20;
  render();
}

/* =====================
   AUTO REFRESH (SAFE)
===================== */
function toggleAutoRefresh() {
  clearInterval(timer);
  timer = null;

  if (autoRefresh.checked) {
    timer = setInterval(loadAudit, 10000); // same logic
  }
}

/* =====================
   PERFORMANCE: TAB VISIBILITY
===================== */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearInterval(timer);
    timer = null;
  } else if (autoRefresh?.checked) {
    toggleAutoRefresh();
  }
});

function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("en-GB", {
    day: "2-digit",
    month: "long",
    year: "numeric"
  });
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("en-US", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });
}
</script>

</body>
</html>
